name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1

      - name: Build the image with the Guix of site/channels.scm
        run: |
          guix time-machine -C site/channels.scm -- \
            pack -f docker -m .guix/image.scm --entry-point=bin/guile \
            -S /bin=bin -S /etc/services=etc/services \
            -S /etc/ssl/certs=etc/ssl/certs --image-tag=chaudron \
            > pack-file
          docker load < "$(cat pack-file)"

      - name: Publish it
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag chaudron:latest ghcr.io/prop4n/chaudron:latest
          docker push ghcr.io/prop4n/chaudron:latest
